  search(first: Int, query: String!, version: String!): [Icon] @deprecated(reason: "Use `searchPaginated` instead, which supports pagination of results, or `searchKit` for searches constrained by a kit's subset.")
  searchPaginated(page: Int, pageSize: Int, query: String!, version: String!): IconsPaginated
}

