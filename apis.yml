apis:
- name: Font Awesome GraphQL API
  description: >-
    Public GraphQL API for programmatically querying Font Awesome releases,
    searching icons and their metadata (family-styles, unicode, aliases, SVG
    path data), and — with an access token — reading account Kits, icon uploads,
    entitlements, and creating Kit downloads and subsets. Most fields are public;
    protected fields require an access token minted at the /token endpoint and
    scoped by permission.
