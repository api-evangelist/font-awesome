aid: font-awesome
name: Font Awesome
description: >-
  Font Awesome is the web's most popular icon library and toolkit, providing
  thousands of SVG, font, and CSS icons across multiple styles and families for
  web, desktop, and mobile projects. Beyond the icon sets and framework
  components (React, Vue, Angular, Ember, Svelte, React Native, WordPress), Font
  Awesome operates a public GraphQL API at api.fontawesome.com that lets
  developers programmatically query releases, search icons and their metadata,
  resolve family-styles and unicode values, and — with an authenticated access
  token — read account Kits, entitlements, and download subsets. The API uses a
  token-exchange endpoint that resolves an account API token into a short-lived
  bearer access token scoped by permission (public, kits_read, svg_icons_free,
  svg_icons_pro, and more). Font Awesome also ships a first-party `fa` CLI and
  official AI agent skills for icon discovery and setup.
